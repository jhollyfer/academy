name: CI

on:
  pull_request:
    branches: [main]

# Um push de cada vez. Sem isto, dois pushes seguidos em `main` disparam dois
# deploys que correm juntos, e o segundo a terminar publica a imagem que
# terminou por ultimo - que nao e necessariamente a do commit mais novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mesma definição que o push em main usa, para o PR não passar por uma régua
  # diferente da do deploy.
  backend-check:
    uses: ./.github/workflows/main-check-backend.yml

  frontend-lint-build:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: ./frontend
        run: pnpm lint

      # `pnpm build` é transpile-only: apaga tipo sem checar nada. Sem este
      # passo, nenhum erro de tipo reprova PR.
      - name: Typecheck
        working-directory: ./frontend
        run: pnpm typecheck

      - name: Test
        working-directory: ./frontend
        run: pnpm test

      - name: Format
        working-directory: ./frontend
        run: pnpm check

      - name: Build
        working-directory: ./frontend
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm build

      # Depois do build, e não antes: o verificador lê o `.output/`, que só
      # existe a partir dali. Rodava só no push para `main`, depois do merge - e
      # um ciclo de chunk devolve `undefined` no primeiro SSR em produção, não no
      # build. O lugar de reprovar isso é o PR.
      - name: Chunk cycles
        working-directory: ./frontend
        run: pnpm check-cycles
