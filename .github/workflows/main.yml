name: Build, Docker and Deploy

on:
  push:
    branches: [main]

# Um push de cada vez. Sem isto, dois pushes seguidos em `main` disparam dois
# deploys que correm juntos, e o segundo a terminar publica a imagem que
# terminou por ultimo - que nao e necessariamente a do commit mais novo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-backend:
    uses: ./.github/workflows/main-check-backend.yml

  build-frontend:
    uses: ./.github/workflows/main-build-frontend.yml

  docker-backend:
    needs: check-backend
    uses: ./.github/workflows/main-docker-backend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-frontend:
    needs: build-frontend
    uses: ./.github/workflows/main-docker-frontend.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-to-coolify:
    needs: [docker-backend, docker-frontend]
    uses: ./.github/workflows/main-deploy-coolify.yml
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
